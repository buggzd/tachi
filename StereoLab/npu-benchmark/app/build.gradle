plugins {
    id "com.android.application"
}

def npuRoot = file("../../.local/npu")
def resolution = providers.gradleProperty("benchmarkResolution").getOrElse("266")
if (!(resolution in ["266", "392", "518"])) throw new GradleException("benchmarkResolution must be 266, 392 or 518")
def manifest = new groovy.json.JsonSlurper().parse(file("../../../AndroidApp/realtime-sbs-runtime.json"))
def expectedModelHash = resolution == "266" ? manifest.modelSha256 : manifest.experimentalModels[resolution].sha256
def modelFile = new File(npuRoot, resolution == "266" ? "depth-anything-v2-small-qnn-266-u16a-i8w.onnx" : manifest.experimentalModels[resolution].file)
def smokeModelFile = file("${npuRoot}/qnn-smoke-qdq-conv-relu.onnx")
def ioSmokeModelFile = file("${npuRoot}/qnn-smoke-qdq-conv-relu-io.onnx")
def reluSmokeModelFile = file("${npuRoot}/qnn-smoke-relu.onnx")
def calibrationDir = file("${npuRoot}/calib")
def generatedAssets = file("${buildDir}/generated/benchmarkAssets")
def qairtHeaders = file("${npuRoot}/qairt-sdk/include")
def qairtRuntime = file("${npuRoot}/qairt-runtime")
if (file("${qairtRuntime}/arm64-v8a/libQnnHtp.so").isFile()
        && !file("${qairtHeaders}/QNN/QnnInterface.h").isFile()) {
    throw new GradleException("Packaged QAIRT requires its matching local SDK headers")
}

android {
    namespace "com.tachi.stereolab.npubenchmark"
    compileSdk 35
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.tachi.stereolab.npubenchmark"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1"
        buildConfigField "int", "MODEL_WIDTH", resolution
        buildConfigField "int", "MODEL_HEIGHT", ["266": "154", "392": "224", "518": "294"][resolution]

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                abiFilters "arm64-v8a"
                if (file("${qairtHeaders}/QNN/QnnInterface.h").isFile()) {
                    arguments "-DQNN_INCLUDE_ROOT=${qairtHeaders}"
                }
            }
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ["META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
}

tasks.register("prepareBenchmarkAssets", Sync) {
    inputs.property("packagedDepthName", "depth-anything-v2-small-qnn-${resolution}-u16a-i8w.onnx")
    if (!modelFile.isFile()) {
        throw new GradleException("Missing local QNN model: ${modelFile}")
    }
    if (java.security.MessageDigest.getInstance("SHA-256").digest(modelFile.bytes).encodeHex().toString() != expectedModelHash) {
        throw new GradleException("Benchmark model hash does not match runtime manifest")
    }
    if (!calibrationDir.isDirectory()) {
        throw new GradleException("Missing local calibration directory: ${calibrationDir}")
    }
    from(modelFile) {
        rename { "depth-anything-v2-small-qnn-${resolution}-u16a-i8w.onnx" }
        into("models")
    }
    if (!smokeModelFile.isFile()) {
        throw new GradleException("Missing local QNN smoke model: ${smokeModelFile}")
    }
    from(smokeModelFile) {
        rename { "qnn-smoke-qdq-conv-relu.onnx" }
        into("models")
    }
    if (!ioSmokeModelFile.isFile()) {
        throw new GradleException("Missing local quantized-I/O QNN smoke model: ${ioSmokeModelFile}")
    }
    from(ioSmokeModelFile) {
        rename { "qnn-smoke-qdq-conv-relu-io.onnx" }
        into("models")
    }
    if (!reluSmokeModelFile.isFile()) {
        throw new GradleException("Missing local QNN Relu smoke model: ${reluSmokeModelFile}")
    }
    from(reluSmokeModelFile) {
        rename { "qnn-smoke-relu.onnx" }
        into("models")
    }
    from(calibrationDir) {
        include "*.png"
        into("calibration")
    }
    into(generatedAssets)
}

android.sourceSets.main.assets.srcDir(generatedAssets)
android.sourceSets.main.jniLibs.srcDir(qairtRuntime)
tasks.named("preBuild").configure {
    dependsOn("prepareBenchmarkAssets")
}

dependencies {
    implementation files("${npuRoot}/onnxruntime-android-qnn-1.22.0.aar")
}
