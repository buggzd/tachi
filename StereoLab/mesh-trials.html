<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>tachi · 深度网格对照</title><link rel="stylesheet" href="/quality-trials.css">
<main><header><div><span class="eyebrow">tachi · DEPTH MESH LAB</span><h1>同一帧，换一种立体重建。</h1></div><a href="/quality-trials.html">原有像素偏移盲测 →</a></header>
<p class="notice">使用已有真实片源和预计算深度，默认 392×224。三种策略共享同一深度帧与视差强度；不代表手机性能。断边网格露出的空洞以紫色显示，不做隐藏回退或补洞。网格不能消除深度本身的时间抖动。</p>
<div class="toolbar"><label>片段<select id="clip"></select></label><label>深度<select id="profile"></select></label></div>
<div class="toolbar"><label>策略<select id="strategy"><option value="pixel">原有像素偏移 · gather33</option><option value="mesh">连续深度网格</option><option value="cut" selected>断边深度网格</option></select></label><label>视图<select id="view"><option value="eye">左眼</option><option value="sbs">双眼 SBS</option><option value="depth">灰度深度</option><option value="source">原片</option></select></label><label>断边阈值<input id="threshold" type="range" min="0.01" max="0.5" step="0.01" value="0.08"><output id="threshold-value">0.08</output></label></div>
<div class="viewer" id="viewer"><canvas id="screen" width="1920" height="1080"></canvas></div>
<div class="transport"><button id="play">播放 / 暂停</button><button id="restart">重播</button><label>定位帧 <input id="seek" type="range" min="0" max="95" value="0"></label><label>放大<select id="zoom"><option value="1">1×</option><option value="2">2× · 点击定位</option></select></label><button id="fullscreen">全屏</button></div>
<p id="status" role="status">加载本地数据…</p><p>建议先暂停并切换策略看轮廓，再播放看跳动。连续网格可能把前后景连接成斜面；断边能减少连接拉伸，但会露底，阈值附近的断边也可能闪烁。这里暂不加新的时间滤波，以便单独比较几何方式。</p>
</main><video id="source" muted playsinline preload="auto" hidden></video><script type="module" src="/mesh-trials.js"></script></html>
