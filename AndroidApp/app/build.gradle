plugins {
    id "com.android.application"
}

def repositoryRoot = rootProject.projectDir.parentFile
def generatedWebAssets = layout.buildDirectory.dir("generated/webAssets")
def versionPropertiesFile = new File(repositoryRoot, "version.properties")
if (!versionPropertiesFile.isFile()) {
    throw new GradleException("Missing version.properties at the repository root.")
}
def versionProperties = new Properties()
versionPropertiesFile.withInputStream { versionProperties.load(it) }
def appVersionName = versionProperties.getProperty("versionName", "").trim()
def appVersionCodeValue = versionProperties.getProperty("versionCode", "").trim()
if (!(appVersionName ==~ /(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?/)) {
    throw new GradleException("versionName must be a SemVer release in version.properties.")
}
if (!(appVersionCodeValue ==~ /[1-9][0-9]*/)) {
    throw new GradleException("versionCode must be a positive integer in version.properties.")
}
def appVersionCode = Integer.parseInt(appVersionCodeValue)

def signingPropertiesFile = rootProject.file("keystore.properties")
def signingProperties = new Properties()
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def environmentSigning = [
        path: System.getenv("ANDROID_KEYSTORE_PATH") ?: "",
        storePassword: System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: "",
        keyAlias: System.getenv("ANDROID_KEY_ALIAS") ?: "",
        keyPassword: System.getenv("ANDROID_KEY_PASSWORD") ?: ""]
def anyEnvironmentSigning = environmentSigning.values().any { !it.isEmpty() }
def hasEnvironmentSigning = environmentSigning.values().every { !it.isEmpty() }
if (anyEnvironmentSigning && !hasEnvironmentSigning) {
    throw new GradleException("All Android release signing environment variables must be set together.")
}
if (hasEnvironmentSigning && !file(environmentSigning.path).isFile()) {
    throw new GradleException("ANDROID_KEYSTORE_PATH does not point to a signing file.")
}
def hasReleaseSigning = signingPropertiesFile.exists() || hasEnvironmentSigning

def dailySbs = providers.gradleProperty("dailySbs").getOrElse("none")
if (!(dailySbs in ["none", "quality", "motion", "liquid"])) throw new GradleException("dailySbs must be quality, motion or liquid")
if ((dailySbs == "liquid") != (providers.gradleProperty("alignedLiquid").getOrElse("false") == "true"))
    throw new GradleException("liquid profile requires alignedLiquid, other app profiles must disable it")
if (dailySbs != "none") {
    def expected = dailySbs == "quality" ? ["518", "12"] : ["392", "24"]
    if (providers.gradleProperty("depthResolution").getOrElse("") != expected[0]
            || providers.gradleProperty("depthHz").getOrElse("") != expected[1]
            || providers.gradleProperty("captureSlots").getOrElse("") != "2"
            || ["realtimeSbs", "gpuDepthStabilization", "gpuPreprocess", "pinnedDepthOutput", "asyncCapturePoll"].any {
                providers.gradleProperty(it).getOrElse("false") != "true"
            }) throw new GradleException("Use scripts/build-sbs-experiment.sh for a complete daily profile")
}

def realtimeSbs = providers.gradleProperty("realtimeSbs").getOrElse("false") == "true"
def realtimeManifest = new groovy.json.JsonSlurper().parse(rootProject.file("realtime-sbs-runtime.json"))
def npuRoot = new File(repositoryRoot, "StereoLab/.local/npu")
def realtimeModel = new File(npuRoot, rootProject.depthProfile.file)
def realtimeRuntime = new File(npuRoot, "qairt-runtime")
def realtimeAssets = layout.buildDirectory.dir("generated/realtimeAssets")
def realtimeLibraries = layout.buildDirectory.dir("generated/realtimeLibraries")
if (realtimeSbs) {
    def verifyHash = { File dependency, String expected ->
        if (!dependency.isFile()) throw new GradleException("Missing local realtime SBS dependency; see docs/REALTIME_SBS.md")
        def actual = dependency.withInputStream { java.security.MessageDigest.getInstance("SHA-256").digest(it.bytes).encodeHex().toString() }
        if (actual != expected) throw new GradleException("Realtime SBS dependency differs from the validated manifest")
    }
    verifyHash(realtimeModel, rootProject.depthProfile.sha256)
    verifyHash(new File(npuRoot, "onnxruntime-android-qnn-1.22.0.aar"), realtimeManifest.ortSha256)
    realtimeManifest.libraries.each { name, digest -> verifyHash(new File(realtimeRuntime, "arm64-v8a/${name}"), digest) }
}

android {
    namespace "com.jellyfinforrayneo.client"
    compileSdk 35
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.jellyfinforrayneo.client"
        minSdk 26
        targetSdk 29
        buildConfigField "String", "DAILY_SBS", "\"${dailySbs}\""
        buildConfigField "String", "REALTIME_MODEL_SHA256", "\"${rootProject.depthProfile.sha256}\""
        buildConfigField "String", "REALTIME_DEPTH_RESOLUTION", "\"${rootProject.depthProfile.width}x${rootProject.depthProfile.height}\""
        versionCode appVersionCode
        versionName appVersionName

        testInstrumentationRunner "android.app.Instrumentation"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile hasEnvironmentSigning
                        ? file(environmentSigning.path)
                        : rootProject.file(signingProperties.getProperty("storeFile"))
                storePassword hasEnvironmentSigning
                        ? environmentSigning.storePassword
                        : signingProperties.getProperty("storePassword")
                keyAlias hasEnvironmentSigning
                        ? environmentSigning.keyAlias
                        : signingProperties.getProperty("keyAlias")
                keyPassword hasEnvironmentSigning
                        ? environmentSigning.keyPassword
                        : signingProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix dailySbs == "none" ? "-debug" : "-sbs-${dailySbs}"
            debuggable dailySbs == "none"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols += ["**/libQnn*.so", "**/libCalculator_skel.so"]
        }
        resources {
            excludes += ["META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

tasks.register("buildGlassesUi", Exec) {
    workingDir repositoryRoot
    commandLine "npm", "--prefix", "GlassesUI", "run", "build"
    inputs.files(
            fileTree("${repositoryRoot}/GlassesUI/src"),
            fileTree("${repositoryRoot}/SharedUI"),
            fileTree("${repositoryRoot}/GlassesUI/public"),
            file("${repositoryRoot}/GlassesUI/index.html"),
            file("${repositoryRoot}/GlassesUI/package.json"),
            file("${repositoryRoot}/GlassesUI/package-lock.json"),
            file("${repositoryRoot}/GlassesUI/tsconfig.json"),
            file("${repositoryRoot}/GlassesUI/tsconfig.app.json"),
            file("${repositoryRoot}/GlassesUI/tsconfig.node.json"),
            file("${repositoryRoot}/GlassesUI/vite.config.ts"),
            versionPropertiesFile)
    outputs.dir(generatedWebAssets.map { it.dir("GlassesUI") })
}

tasks.register("buildCompanionUi", Exec) {
    workingDir repositoryRoot
    commandLine "npm", "--prefix", "CompanionUI", "run", "build"
    inputs.files(
            fileTree("${repositoryRoot}/CompanionUI/src"),
            fileTree("${repositoryRoot}/SharedUI"),
            fileTree("${repositoryRoot}/CompanionUI/public"),
            file("${repositoryRoot}/CompanionUI/index.html"),
            file("${repositoryRoot}/CompanionUI/package.json"),
            file("${repositoryRoot}/CompanionUI/vite.config.mjs"),
            versionPropertiesFile,
            file("${repositoryRoot}/CompanionUI/package-lock.json"))
    outputs.dir(generatedWebAssets.map { it.dir("CompanionUI") })
}

tasks.register("verifyProductionAssets") {
    dependsOn "buildGlassesUi", "buildCompanionUi"
    doLast {
        def forbidden = files(fileTree("src/main/assets"), fileTree(generatedWebAssets)).asFileTree.matching {
            include "**/.jellyfin-dev.json", "**/*jellyfin-dev*"
        }.files
        if (!forbidden.isEmpty()) {
            throw new GradleException("Development Jellyfin configuration must not enter APK assets.")
        }
        ["GlassesUI/index.html", "CompanionUI/index.html"].each { relativePath ->
            if (!generatedWebAssets.get().file(relativePath).asFile.isFile()) {
                throw new GradleException("Missing production asset: ${relativePath}")
            }
        }
    }
}

// Keep generated assets in the task graph for Android Studio and direct Gradle builds.
android.sourceSets.main.assets.srcDir(
        files(generatedWebAssets).builtBy("verifyProductionAssets"))

tasks.named("preBuild").configure {
    dependsOn "verifyProductionAssets"
}

dependencies {
    implementation project(":native-video")
    implementation "androidx.core:core:1.15.0"
    implementation "androidx.exifinterface:exifinterface:1.4.2"
    compileOnly "androidx.annotation:annotation:1.8.1"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}

android.sourceSets.main.java.srcDir(realtimeSbs ? "src/realtime/java" : "src/standard/java")
if (realtimeSbs) {
    android.sourceSets.debug.manifest.srcFile("src/realtime/AndroidManifest.xml")
    android.sourceSets.release.manifest.srcFile("src/realtime/AndroidManifest.xml")
    tasks.register("prepareRealtimeLibraries", Sync) {
        from(new File(realtimeRuntime, "arm64-v8a")) {
            include realtimeManifest.libraries.keySet().toList()
            into("arm64-v8a")
        }
        into(realtimeLibraries)
    }
    android.sourceSets.main.jniLibs.srcDir(files(realtimeLibraries).builtBy("prepareRealtimeLibraries"))
    tasks.register("prepareRealtimeAssets", Sync) {
        from(realtimeModel) { rename { "depth.onnx" }; into("realtime-sbs") }
        into(realtimeAssets)
    }
    android.sourceSets.main.assets.srcDir(files(realtimeAssets).builtBy("prepareRealtimeAssets"))
    tasks.named("preBuild").configure { dependsOn "prepareRealtimeAssets", "prepareRealtimeLibraries" }
    dependencies { implementation files(new File(npuRoot, "onnxruntime-android-qnn-1.22.0.aar")) }
}
