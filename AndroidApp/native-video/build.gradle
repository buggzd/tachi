plugins { id "com.android.library" }
android {
    namespace "com.jellyfinforrayneo.video"
    compileSdk 35
    defaultConfig {
        minSdk 26
        buildConfigField "boolean", "FULL_PRODUCTION", rootProject.productionLiquid.toString()
        buildConfigField "boolean", "LIQUID_FUSED_ROUNDS", rootProject.sbsOption("liquidFusedRounds", "false")
        buildConfigField "boolean", "LIQUID_CACHE_SAMPLES", rootProject.sbsOption("liquidCacheSamples", "false")
        buildConfigField "boolean", "CAPTURE_BEFORE_LIQUID", rootProject.sbsOption("captureBeforeLiquid", "false")
        buildConfigField "boolean", "GPU_POLL_OFF_MAIN", rootProject.sbsOption("gpuPollOffMain", "false")
        buildConfigField "int", "DEPTH_SAMPLE_WIDTH", "${rootProject.depthProfile.width}"
        buildConfigField "int", "DEPTH_SAMPLE_HEIGHT", "${rootProject.depthProfile.height}"
        buildConfigField "boolean", "ASYNC_CAPTURE_POLL", rootProject.sbsOption("asyncCapturePoll", "false")
        buildConfigField "int", "DEPTH_HZ", rootProject.sbsOption("depthHz", "12")
        buildConfigField "boolean", "GPU_PREPROCESS", rootProject.sbsOption("gpuPreprocess", "false")
        buildConfigField "boolean", "PINNED_DEPTH_OUTPUT", rootProject.sbsOption("pinnedDepthOutput", "false")
        buildConfigField "int", "CAPTURE_SLOTS", rootProject.sbsOption("captureSlots", "1")
        buildConfigField "boolean", "ALIGNED_LIQUID", rootProject.sbsOption("alignedLiquid", "false")
        buildConfigField "boolean", "GPU_DEPTH_STABILIZATION", rootProject.sbsOption("gpuDepthStabilization", "false")
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    testOptions { unitTests.returnDefaultValues = true }
    lint { abortOnError true }
}
dependencies {
    api "androidx.media3:media3-exoplayer:1.5.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.5.1"
    testImplementation "junit:junit:4.13.2"
}

def qnn = providers.gradleProperty("nativeQnn").getOrElse("false") == "true" || providers.gradleProperty("realtimeSbs").getOrElse("false") == "true"
android.sourceSets.main.java.srcDir(qnn ? "src/qnn/java" : "src/standard/java")
if (qnn) {
    dependencies { compileOnly files(new File(rootProject.projectDir.parentFile, "StereoLab/.local/npu/onnxruntime-android-qnn-1.22.0.aar")) }
}

if (!(rootProject.sbsOption("captureSlots", "1") in ["1", "2"]))
    throw new GradleException("captureSlots must be 1 or 2")
if (rootProject.sbsOption("gpuPreprocess", "false") == "true"
        && (!qnn || rootProject.sbsOption("gpuDepthStabilization", "false") != "true"))
    throw new GradleException("gpuPreprocess requires QNN and GPU depth stabilization")

if (!(rootProject.sbsOption("depthHz", "12") in ["12", "24"]))
    throw new GradleException("depthHz must be 12 or 24")

if (rootProject.sbsOption("alignedLiquid", "false") == "true"
        && (rootProject.depthProfile.width != 392 || !qnn
        || rootProject.sbsOption("gpuDepthStabilization", "false") != "true"))
    throw new GradleException("alignedLiquid requires 392 QNN and GPU depth processing")
