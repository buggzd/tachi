name: Signed Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated release tag to build
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed Lite and Full APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Restore annotated release tag object
        shell: bash
        run: git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

      - name: Require complete signing configuration
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in \
              ANDROID_KEYSTORE_BASE64 \
              ANDROID_KEYSTORE_PASSWORD \
              ANDROID_KEY_ALIAS \
              ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Missing required repository secret: ${secret_name}" >&2
              exit 1
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            CompanionUI/package-lock.json
            GlassesUI/package-lock.json

      - name: Install release verification tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android platform and build tools
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Verify release version
        shell: bash
        run: ./scripts/verify-version.sh "${RELEASE_TAG}"

      - name: Restore release signing key
        shell: bash
        run: |
          set -euo pipefail
          signing_file="${RUNNER_TEMP}/rayneo-release.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${signing_file}"
          chmod 600 "${signing_file}"
          echo "ANDROID_KEYSTORE_PATH=${signing_file}" >> "${GITHUB_ENV}"

      - name: Restore pinned realtime SBS inputs
        env:
          REALTIME_SBS_BUNDLE_URL: ${{ secrets.REALTIME_SBS_BUNDLE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${REALTIME_SBS_BUNDLE_URL}" ]]; then
            echo "Missing REALTIME_SBS_BUNDLE_URL; see docs/RELEASE.md" >&2
            exit 1
          fi
          bundle="${RUNNER_TEMP}/realtime-sbs.zip"
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error \
            --location --max-time 600 --max-filesize 536870912 \
            --output "${bundle}" "${REALTIME_SBS_BUNDLE_URL}"
          python3 scripts/realtime-sbs-bundle.py install "${bundle}"
          rm "${bundle}"

      - name: Build and verify both release APKs
        shell: bash
        run: |
          set -euo pipefail
          release_directory="${RUNNER_TEMP}/release"
          mkdir -p "${release_directory}"
          for variant in lite full; do
            ./scripts/build-android.sh release "${variant}"
            apk_path="AndroidApp/app/build/outputs/apk/release/app-release.apk"
            "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --verbose "${apk_path}"
            asset_name="tachi-${RELEASE_TAG#v}-${variant}-arm64-v8a.apk"
            cp "${apk_path}" "${release_directory}/${asset_name}"
            (cd "${release_directory}" && sha256sum "${asset_name}" > "${asset_name}.sha256")
          done
          echo "RELEASE_DIRECTORY=${release_directory}" >> "${GITHUB_ENV}"

      - name: Verify source tree remains clean
        shell: bash
        run: git diff --exit-code

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_flags=(
            --verify-tag
            --generate-notes
            --title "tachi ${RELEASE_TAG}"
            --notes "正式签名 ARM64 双版本：Full 内置深度模型与 QNN（当前验证 SM8850/V81）；Lite 不带模型及 QNN，支持原生 2D 与平面 SBS，不支持实时 2D 转 3D。两版同签名同包名，可覆盖切换并保留设置。请使用随附 SHA-256 校验下载。"
          )
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--latest)
          fi
          gh release create "${RELEASE_TAG}" \
            "${RELEASE_DIRECTORY}"/*.apk "${RELEASE_DIRECTORY}"/*.sha256 \
            "${release_flags[@]}"
