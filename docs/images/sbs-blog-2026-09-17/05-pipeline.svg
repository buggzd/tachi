<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665" role="img"><title>05 / 手机上的实时 SBS，是一条有界流水线</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#536981"/></marker><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#ffe8f1"/><path d="M0 9 L9 0" stroke="#d04c83" stroke-width="2"/></pattern></defs><rect width="1200" height="665" fill="#f5f8fc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="42" y="52" font-size="30" fill="#152b43" font-weight="600">05 / 手机上的实时 SBS，是一条有界流水线</text><text x="42" y="86" font-size="17" fill="#536981" font-weight="400">CPU 管调度和所有权，NPU 估计深度，GPU 预处理、计算位移并合成双眼。</text><rect x="42" y="126" width="330" height="113" rx="12" fill="#ffffff" stroke="none"/><rect x="42" y="126" width="5" height="113" rx="2" fill="#377be9" stroke="none"/><text x="60" y="157" font-size="21" fill="#377be9" font-weight="600">Media3 / MediaCodec</text><text x="60" y="188" font-size="17" fill="#152b43" font-weight="400">硬件解码 → OES 纹理</text><text x="60" y="215" font-size="17" fill="#152b43" font-weight="400">记录媒体 PTS</text><rect x="435" y="126" width="340" height="113" rx="12" fill="#ffffff" stroke="none"/><rect x="435" y="126" width="5" height="113" rx="2" fill="#377be9" stroke="none"/><text x="453" y="157" font-size="21" fill="#377be9" font-weight="600">双捕获槽</text><text x="453" y="188" font-size="17" fill="#152b43" font-weight="400">保留全尺寸 RGB 快照</text><text x="453" y="215" font-size="17" fill="#152b43" font-weight="400">生成 392 × 224 模型输入</text><rect x="838" y="126" width="320" height="113" rx="12" fill="#ffffff" stroke="none"/><rect x="838" y="126" width="5" height="113" rx="2" fill="#e99632" stroke="none"/><text x="856" y="157" font-size="21" fill="#e99632" font-weight="600">QNN HTP</text><text x="856" y="188" font-size="17" fill="#152b43" font-weight="400">主机输入 → NPU 推理</text><text x="856" y="215" font-size="17" fill="#152b43" font-weight="400">输出仍经主机交接</text><path d="M372 184 L427 184" stroke="#536981" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M775 184 L830 184" stroke="#536981" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="838" y="318" width="320" height="121" rx="12" fill="#ffffff" stroke="none"/><rect x="838" y="318" width="5" height="121" rx="2" fill="#008a82" stroke="none"/><text x="856" y="349" font-size="21" fill="#008a82" font-weight="600">GPU 深度 / 位移</text><text x="856" y="380" font-size="17" fill="#152b43" font-weight="400">逐帧精确 P2 / P98</text><text x="856" y="407" font-size="17" fill="#152b43" font-weight="400">局部液化 + 8 轮扩散</text><path d="M998 239 L998 310" stroke="#536981" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="435" y="318" width="340" height="121" rx="12" fill="#ffffff" stroke="none"/><rect x="435" y="318" width="5" height="121" rx="2" fill="#008a82" stroke="none"/><text x="453" y="349" font-size="21" fill="#008a82" font-weight="600">RGB + 深度整对提交</text><text x="453" y="380" font-size="17" fill="#152b43" font-weight="400">同源时间戳与独立纹理</text><text x="453" y="407" font-size="17" fill="#152b43" font-weight="400">seek / 换源清除旧代结果</text><path d="M838 377 L783 377" stroke="#536981" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="42" y="318" width="330" height="121" rx="12" fill="#ffffff" stroke="none"/><rect x="42" y="318" width="5" height="121" rx="2" fill="#d04c83" stroke="none"/><text x="60" y="349" font-size="21" fill="#d04c83" font-weight="600">GLES 双眼合成</text><text x="60" y="380" font-size="17" fill="#152b43" font-weight="400">连续投影区间反求</text><text x="60" y="407" font-size="17" fill="#152b43" font-weight="400">SBS FBO → 眼镜显示</text><path d="M435 377 L380 377" stroke="#536981" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M603 239 L603 310" stroke="#377be9" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="620" y="282" font-size="16" fill="#377be9" font-weight="400">保留的 RGB</text><rect x="42" y="483" width="1116" height="109" rx="12" fill="#e8eef6" stroke="none"/><text x="65" y="518" font-size="22" fill="#152b43" font-weight="600">忙时：跳过采集，复用上一对的 SBS 缓存；不让排队长度无限增长。</text><text x="65" y="556" font-size="20" fill="#536981" font-weight="400">24 Hz 是新配对的调度目标。重复显示缓存不能计为新的 2D → 3D 转换帧。</text><text x="42" y="643" font-size="14" fill="#536981" font-weight="400">tachi · 原创原理示意，非片源截图 / 非算法画质对照 · 2026-09-17</text></g></svg>