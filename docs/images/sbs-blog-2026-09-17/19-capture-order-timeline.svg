<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img"><title>19 / 调整排队顺序：让 B 先进去，又不让 A 多等一次</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#73899e"/></marker><pattern id="wait" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#fff0d7"/><path d="M0 10L10 0" stroke="#e9c582"/></pattern></defs><rect width="1400" height="920" fill="#f5f8fc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="36" y="48" font-size="29" fill="#17324d">19 / 调整排队顺序：让 B 先进去，又不让 A 多等一次</text><text x="36" y="82" font-size="18" fill="#526b82">A：刚配对完成，等待液化与双眼重建。B：符合条件、可以尝试捕获的下一帧。</text><rect x="30" y="115" width="1340" height="205" rx="8" fill="#ffffff" stroke="#c1cfdb"/><text x="48" y="148" font-size="24" fill="#17324d">原顺序</text><text x="48" y="202" font-size="18" fill="#526b82">提交顺序</text><text x="48" y="278" font-size="18" fill="#526b82">B 的输入</text><rect x="240" y="248" width="260" height="45" rx="8" fill="url(#wait)" stroke="#c1cfdb"/><text x="252" y="276.5" font-size="18" fill="#17324d">等前面的 A 液化</text><rect x="520" y="248" width="330" height="45" rx="8" fill="#d4eee8" stroke="#c1cfdb"/><text x="532" y="276.5" font-size="18" fill="#17324d">B 输入工作较晚入队</text><rect x="240" y="172" width="260" height="52" rx="8" fill="#d9eaff" stroke="#c1cfdb"/><text x="252" y="204.33333333333334" font-size="19" fill="#17324d">提交 A 液化</text><path d="M503 198L515 198" fill="none" stroke="#73899e" stroke-width="2" marker-end="url(#arr)"/><rect x="520" y="172" width="330" height="52" rx="8" fill="#d4eee8" stroke="#c1cfdb"/><text x="532" y="204.33333333333334" font-size="19" fill="#17324d">释放槽 / 尝试捕获 B</text><path d="M853 198L865 198" fill="none" stroke="#73899e" stroke-width="2" marker-end="url(#arr)"/><rect x="870" y="172" width="420" height="52" rx="8" fill="#d9eaff" stroke="#c1cfdb"/><text x="882" y="204.33333333333334" font-size="19" fill="#17324d">后续绘制 A</text><rect x="30" y="345" width="1340" height="205" rx="8" fill="#ffffff" stroke="#c1cfdb"/><text x="48" y="378" font-size="24" fill="#17324d">第一版 / 未采用</text><text x="48" y="432" font-size="18" fill="#526b82">提交顺序</text><text x="48" y="508" font-size="18" fill="#526b82">B 的输入</text><rect x="240" y="478" width="330" height="45" rx="8" fill="#d4eee8" stroke="#c1cfdb"/><text x="252" y="506.5" font-size="18" fill="#17324d">B 先入队了</text><text x="610" y="510" font-size="20" fill="#9a5f1b">但 A 的等待被挪到了绘制前</text><rect x="240" y="402" width="330" height="52" rx="8" fill="#d4eee8" stroke="#c1cfdb"/><text x="252" y="434.3333333333333" font-size="19" fill="#17324d">释放槽 / 尝试捕获 B</text><path d="M573 428L585 428" fill="none" stroke="#73899e" stroke-width="2" marker-end="url(#arr)"/><rect x="590" y="402" width="260" height="52" rx="8" fill="url(#wait)" stroke="#c1cfdb"/><text x="602" y="434.3333333333333" font-size="19" fill="#17324d">等下一次绘制回调</text><path d="M853 428L865 428" fill="none" stroke="#73899e" stroke-width="2" marker-end="url(#arr)"/><rect x="870" y="402" width="420" height="52" rx="8" fill="#d9eaff" stroke="#c1cfdb"/><text x="882" y="434.3333333333333" font-size="19" fill="#17324d">才提交 A 液化 / 绘制</text><rect x="30" y="575" width="1340" height="205" rx="8" fill="#ffffff" stroke="#c1cfdb"/><text x="48" y="608" font-size="24" fill="#17324d">修正版 / 保留</text><text x="48" y="662" font-size="18" fill="#526b82">提交顺序</text><text x="48" y="738" font-size="18" fill="#526b82">B 的输入</text><rect x="240" y="708" width="330" height="45" rx="8" fill="#d4eee8" stroke="#c1cfdb"/><text x="252" y="736.5" font-size="18" fill="#17324d">B 输入更早入队</text><text x="610" y="740" font-size="20" fill="#23715c">A 不额外等待下一次绘制回调</text><rect x="240" y="632" width="330" height="52" rx="8" fill="#d4eee8" stroke="#c1cfdb"/><text x="252" y="664.3333333333334" font-size="19" fill="#17324d">释放槽 / 尝试捕获 B</text><path d="M573 658L585 658" fill="none" stroke="#73899e" stroke-width="2" marker-end="url(#arr)"/><rect x="590" y="632" width="300" height="52" rx="8" fill="#d9eaff" stroke="#c1cfdb"/><text x="602" y="664.3333333333334" font-size="19" fill="#17324d">立即提交 A 液化</text><path d="M893 658L905 658" fill="none" stroke="#73899e" stroke-width="2" marker-end="url(#arr)"/><rect x="910" y="632" width="380" height="52" rx="8" fill="#d9eaff" stroke="#c1cfdb"/><text x="922" y="664.3333333333334" font-size="19" fill="#17324d">后续绘制 A</text><text x="40" y="824" font-size="22" fill="#17324d">完整 tachi 同片源短测：22.68 → 23.62 Hz；捕获到绘制开始 85.80 → 82.06 ms。</text><text x="40" y="861" font-size="19" fill="#526b82">顺序测试结果；不是屏幕发光延迟。B 不满足补采条件时跳过它，继续处理 A。</text><text x="36" y="896" font-size="16" fill="#526b82">调度关系示意，非实测 GPU 时间线；块宽不按耗时比例。A / B 表示各自完整配对的帧。</text></g></svg>