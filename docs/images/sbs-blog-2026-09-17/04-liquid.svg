 x="808" y="137" font-size="23" fill="#152b43" font-weight="600">背景局部液化</text><rect x="808" y="159" width="350" height="267" rx="0" fill="#e4eff5" stroke="none"/><path d="M843 159 L843 220 Q843 278 843 307 L843 375 L843 426" fill="none" stroke="#88abbc" stroke-width="2"/><path d="M878 159 L878 220 Q878 278 878 307 L878 375 L878 426" fill="none" stroke="#88abbc" stroke-width="2"/><path d="M913 159 L913 220 Q937 278 937 307 L913 375 L913 426" fill="none" stroke="#88abbc" stroke-width="2"/><path d="M948 159 L948 220 Q972 278 972 307 L948 375 L948 426" fill="none" stroke="#88abbc" stroke-width="2"/><path d="M983 159 L983 220 Q983 278 983 307 L983 375 L983 426" fill="none" stroke="#88abbc" stroke-width="2"/><path d="M1018 159 L1018 220 Q1018 278 1018 307 L1018 375 L1018 426" fill="none" stroke="#88abbc" stroke-width="2"/><path d="M1053 159 L1053 220 Q1053 278 1053 307 L1053 375 L1053 426" fill="none" stroke="#88abbc" stroke-width="2"/><path d="M1088 159 L1088 220 Q1088 278 1088 307 L1088 375 L1088 426" fill="none" stroke="#88abbc" stroke-width="2"/><path d="M1123 159 L1123 220 Q1123 278 1123 307 L1123 375 L1123 426" fill="none" stroke="#88abbc" stroke-width="2"/><path d="M808 194 L1158 194" stroke="#88abbc" stroke-width="2" fill="none"/><path d="M808 229 L1158 229" stroke="#88abbc" stroke-width="2" fill="none"/><path d="M808 264 L1158 264" stroke="#88abbc" stroke-width="2" fill="none"/><path d="M808 299 L1158 299" stroke="#88abbc" stroke-width="2" fill="none"/><path d="M808 334 L1158 334" stroke="#88abbc" stroke-width="2" fill="none"/><path d="M808 369 L1158 369" stroke="#88abbc" stroke-width="2" fill="none"/><path d="M808 404 L1158 404" stroke="#88abbc" stroke-width="2" fill="none"/><rect x="964" y="222" width="95" height="128" rx="3" fill="#e99632" stroke="none"/><text x="808" y="460" font-size="17" fill="#536981" font-weight="400">把背景局部拉向露出边缘</text><text x="42" y="516" font-size="21" fill="#008a82" font-weight="600">羽化 96 px：形变影响范围；拉伸 65%：修正量权重；均不是 RGB 模糊强度。</text><text x="42" y="551" font-size="19" fill="#536981" font-weight="400">原生实现依然判断近景遮挡，并为未覆盖区域保留 gather 回退。</text><text x="42" y="618" font-size="14" fill="#536981" font-weight="400">tachi · 原创原理示意，非片源截图 / 非算法画质对照 · 2026-09-17</text></g></svg>