<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img"><title>04 / 背景局部液化：把变形限制在露出侧</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#536981"/></marker><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#ffe8f1"/><path d="M0 9 L9 0" stroke="#d04c83" stroke-width="2"/></pattern></defs><rect width="1200" height="640" fill="#f5f8fc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="42" y="52" font-size="30" fill="#152b43" font-weight="600">04 / 背景局部液化：把变形限制在露出侧</text><text x="42" y="86" font-size="17" fill="#536981" font-weight="400">以下网格仅解释形变方向；不是运行 tachi shader 得到的输出，也不保证所有场景都无洞。</text><text x="42" y="137" font-size="23" fill="#152b43" font-weight="600">原始纹理</text><rect x="42" y="159" width="350" height="267" rx="0" fill="#e4eff5" stroke="none"/><path d="M77 159 L77 426" stroke="#88abbc" stroke-width="2" fill="none"/><path d="M112 159 L112 426" stroke="#88abbc" stroke-width="2" fill="none"/><path d="M147 159 L147 426" stroke="#88abbc" stroke-width="2" fill="none"/><path d="M182 159 L182 426" stroke="#88abbc" stroke-width="2" fill="none"/><path d="M217 159 L217 426" stroke="#88abbc" stroke-width="2" fill="none"/><path d="M252 159 L252 426" stroke="#88abbc" stroke-width="2" fill="none"/><path d="M287 159 L287 426" stroke="#88abbc" stroke-width="2" fill="none"/><path d="M322 159 L322 426" stroke="#88abbc" stroke-width="2" fill="none"/><path d="M357 159 L357 426" stroke="#88abbc" stroke-width="2" fill="none"/><path d="M42 194 L392 194" stroke="#88abbc" stroke-width="2" fill="none"/><path d="M42 229 L392 229" stroke="#88abbc" stroke-width="2" fill="none"/><path d="M42 264 L392 264" stroke="#88abbc" stroke-width="2" fill="none"/><path d="M42 299 L392 299" stroke="#88abbc" stroke-width="2" fill="none"/><path d="M42 334 L392 334" stroke="#88abbc" stroke-width="2" fill="none"/><path d