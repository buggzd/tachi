<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img"><title>02 / 四种实现，把差异放在“坐标与可见性”上</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#536981"/></marker><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#ffe8f1"/><path d="M0 9 L9 0" stroke="#d04c83" stroke-width="2"/></pattern></defs><rect width="1200" height="740" fill="#f5f8fc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="42" y="52" font-size="30" fill="#152b43" font-weight="600">02 / 四种实现，把差异放在“坐标与可见性”上</text><text x="42" y="86" font-size="17" fill="#536981" font-weight="400">前三行是参考项目；最后一行是 tachi 当前原生方案。方法名称不代表统一画质排名。</text><rect x="42" y="119" width="1116" height="123" rx="12" fill="#ffffff" stroke="none"/><text x="60" y="156" font-size="24" fill="#377be9" font-weight="600">depth-surge-3d</text><text x="60" y="189" font-size="18" fill="#536981" font-weight="400">解析反向采样</text><text x="358" y="158" font-size="19" fill="#152b43" font-weight="400">深度 → 视差</text><text x="358" y="190" font-size="19" fill="#152b43" font-weight="400">OpenCV remap</text><path d="M680 179 L728 179" stroke="#536981" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="760" y="158" font-size="19" fill="#152b43" font-weight="400">按黑色像素推测洞</text><text x="760" y="190" font-size="19" fill="#152b43" font-weight="400">Telea / NS 修补</text><rect x="42" y="258" width="1116" height="123" rx="12" fill="#ffffff" stroke="none"/><text x="60" y="295" font-size="24" fill="#e99632" font-weight="600">qinglong-vr</text><text x="60" y="328" font-size="18" fill="#536981" font-weight="400">边界与覆盖优先</text><text x="358" y="297" font-size="19" fill="#152b43" font-weight="400">RGB 引导区域归属</text><text x="358" y="329" font-size="19" fill="#152b43" font-weight="400">16 子像素前向 splat</text><path d="M680 318 L728 318" stroke="#536981" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="760" y="297" font-size="19" fill="#152b43" font-weight="400">近景遮挡 + 覆盖掩膜</text><text x="760" y="329" font-size="19" fill="#152b43" font-weight="400">背景代理 + Telea</text><rect x="42" y="397" width="1116" height="123" rx="12" fill="#ffffff" stroke="none"/><text x="60" y="434" font-size="24" fill="#008a82" font-weight="600">iw3 / RowFlowV3</text><text x="60" y="467" font-size="18" fill="#536981" font-weight="400">学习反向采样</text><text x="358" y="436" font-size="19" fill="#152b43" font-weight="400">深度 + 强度 + 会聚</text><text x="358" y="468" font-size="19" fill="#152b43" font-weight="400">网络预测横向 delta</text><path d="M680 457 L728 457" stroke="#536981" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="760" y="436" font-size="19" fill="#152b43" font-weight="400">grid_sample 取原图颜色</text><text x="760" y="468" font-size="19" fill="#152b43" font-weight="400">可拉伸，不恢复隐藏内容</text><rect x="42" y="536" width="1116" height="123" rx="12" fill="#ffffff" stroke="none"/><text x="60" y="573" font-size="24" fill="#d04c83" font-weight="600">tachi / liquid</text><text x="60" y="606" font-size="18" fill="#536981" font-weight="400">局部几何形变</text><text x="358" y="575" font-size="19" fill="#152b43" font-weight="400">同帧深度 → 背景修正</text><text x="358" y="607" font-size="19" fill="#152b43" font-weight="400">8 轮深度引导扩散</text><path d="M680 596 L728 596" stroke="#536981" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="760" y="575" font-size="19" fill="#152b43" font-weight="400">投影线段反求 + 近景优先</text><text x="760" y="607" font-size="19" fill="#152b43" font-weight="400">未覆盖时 gather 回退</text><text x="42" y="718" font-size="14" fill="#536981" font-weight="400">tachi · 原创原理示意，非片源截图 / 非算法画质对照 · 2026-09-17</text></g></svg>