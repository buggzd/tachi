<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img"><title>18 / 槽刚空出来，别把仍可处理的那一帧漏掉</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#73899e"/></marker><pattern id="wait" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#fff0d7"/><path d="M0 10L10 0" stroke="#e9c582"/></pattern></defs><rect width="1400" height="700" fill="#f5f8fc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="36" y="48" font-size="29" fill="#17324d">18 / 槽刚空出来，别把仍可处理的那一帧漏掉</text><text x="36" y="82" font-size="18" fill="#526b82">补采不增加缓冲深度；只重试当前仍锁定的 RGB 帧，新帧或时间轴变化会淘汰旧机会。</text><path d="M205 130L1330 130" fill="none" stroke="#73899e" stroke-width="2" marker-end="url(#arr)"/><text x="1190" y="118" font-size="17" fill="#526b82">时间向右 →</text><text x="36" y="199" font-size="21" fill="#17324d">当前纹理</text><rect x="210" y="170" width="725" height="58" rx="8" fill="#d9eaff" stroke="#c1cfdb"/><text x="222" y="205.33333333333334" font-size="19" fill="#17324d">A 帧仍锁在 OES 纹理中</text><rect x="950" y="170" width="370" height="58" rx="8" fill="#d4eee8" stroke="#c1cfdb"/><text x="962" y="205.33333333333334" font-size="19" fill="#17324d">B 帧已到达</text><text x="36" y="299" font-size="21" fill="#17324d">捕获槽</text><rect x="210" y="270" width="340" height="58" rx="8" fill="url(#wait)" stroke="#c1cfdb"/><text x="222" y="305.3333333333333" font-size="19" fill="#17324d">两个槽都忙</text><rect x="565" y="270" width="755" height="58" rx="8" fill="#e0eee5" stroke="#c1cfdb"/><text x="577" y="305.3333333333333" font-size="19" fill="#17324d">至少一个槽已释放，可重新尝试</text><path d="M565 240L565 540" fill="none" stroke="#73899e" stroke-width="2" stroke-dasharray="6 5"/><text x="575" y="255" font-size="17" fill="#526b82">释放时刻</text><text x="36" y="409" font-size="21" fill="#17324d">原来</text><rect x="210" y="375" width="265" height="62" rx="8" fill="#fff0d7" stroke="#c1cfdb"/><text x="222" y="412.3333333333333" font-size="19" fill="#17324d">A 首次尝试：槽忙</text><path d="M490 406L910 406" fill="none" stroke="#73899e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="600" y="393" font-size="19" fill="#526b82">槽空了，但错过 A 的机会</text><text x="36" y="509" font-size="21" fill="#17324d">补采后</text><rect x="210" y="475" width="265" height="62" rx="8" fill="#d9eaff" stroke="#c1cfdb"/><text x="222" y="512.3333333333334" font-size="19" fill="#17324d">记录 A 的补采机会</text><path d="M485 506L570 506" fill="none" stroke="#73899e" stroke-width="2" marker-end="url(#arr)"/><rect x="580" y="475" width="325" height="62" rx="8" fill="#d9eaff" stroke="#c1cfdb"/><text x="592" y="512.3333333333334" font-size="19" fill="#17324d">后续事件检查 → 捕获 A</text><rect x="950" y="475" width="370" height="62" rx="8" fill="#d4eee8" stroke="#c1cfdb"/><text x="962" y="512.3333333333334" font-size="19" fill="#17324d">若已到 B：放弃旧 A 机会</text><text x="40" y="600" font-size="21" fill="#17324d">成功捕获才推进 PTS 采样节拍；回调早晚不再决定是否误跳这一帧。</text><text x="40" y="637" font-size="19" fill="#526b82">结果未就绪时继续复用 SBS 缓存，不为“刚提交任务”额外请求一次无变化的绘制。</text><text x="36" y="676" font-size="16" fill="#526b82">调度关系示意，非实测 GPU 时间线；块宽不按耗时比例。A / B 表示各自完整配对的帧。</text></g></svg>