<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img"><title>16 / 两个槽，怎样让不同帧接着处理</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#73899e"/></marker><pattern id="wait" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#fff0d7"/><path d="M0 10L10 0" stroke="#e9c582"/></pattern></defs><rect width="1400" height="760" fill="#f5f8fc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="36" y="48" font-size="29" fill="#17324d">16 / 两个槽，怎样让不同帧接着处理</text><text x="36" y="82" font-size="18" fill="#526b82">同色代表同一帧。NPU 串行推理；GPU 取下一帧可以与 NPU 处理上一帧重叠。</text><path d="M205 125L1330 125" fill="none" stroke="#73899e" stroke-width="2" marker-end="url(#arr)"/><text x="1190" y="113" font-size="17" fill="#526b82">时间向右 →</text><text x="36" y="193" font-size="20" fill="#17324d">GPU / GL 队列</text><text x="36" y="308" font-size="20" fill="#17324d">主机交接</text><text x="36" y="403" font-size="20" fill="#17324d">NPU</text><text x="36" y="508" font-size="20" fill="#17324d">捕获槽 1</text><text x="36" y="588" font-size="20" fill="#17324d">捕获槽 2</text><text x="36" y="678" font-size="20" fill="#17324d">显示缓存</text><rect x="210" y="165" width="165" height="60" rx="8" fill="#d9eaff" stroke="#c1cfdb"/><text x="222" y="200.66666666666666" font-size="17" fill="#17324d">A 捕获 / 预处理</text><rect x="485" y="165" width="165" height="60" rx="8" fill="#d4eee8" stroke="#c1cfdb"/><text x="497" y="200.66666666666666" font-size="17" fill="#17324d">B 捕获 / 预处理</text><rect x="790" y="165" width="145" height="60" rx="8" fill="#d9eaff" stroke="#c1cfdb"/><text x="802" y="200.66666666666666" font-size="17" fill="#17324d">A 归一 / 液化</text><rect x="950" y="165" width="130" height="60" rx="8" fill="#d9eaff" stroke="#c1cfdb"/><text x="962" y="200.66666666666666" font-size="17" fill="#17324d">A 双眼重建</text><rect x="1140" y="165" width="155" height="60" rx="8" fill="#d4eee8" stroke="#c1cfdb"/><text x="1152" y="200.66666666666666" font-size="17" fill="#17324d">B 后处理 / 重建</text><rect x="375" y="280" width="110" height="48" rx="8" fill="#d9eaff" stroke="#c1cfdb"/><text x="387" y="310.3333333333333" font-size="19" fill="#17324d">A 输入</text><rect x="730" y="280" width="60" height="48" rx="8" fill="#d9eaff" stroke="#c1cfdb"/><text x="742" y="310.3333333333333" font-size="19" fill="#17324d">A 出</text><rect x="650" y="337" width="135" height="30" rx="8" fill="#d4eee8" stroke="#c1cfdb"/><text x="662" y="357.3333333333333" font-size="16" fill="#17324d">B 输入交接</text><rect x="1070" y="280" width="70" height="48" rx="8" fill="#d4eee8" stroke="#c1cfdb"/><text x="1082" y="310.3333333333333" font-size="19" fill="#17324d">B 出</text><rect x="485" y="375" width="245" height="60" rx="8" fill="#d9eaff" stroke="#c1cfdb"/><text x="497" y="411.3333333333333" font-size="19" fill="#17324d">A 深度推理</text><rect x="790" y="375" width="280" height="60" rx="8" fill="#d4eee8" stroke="#c1cfdb"/><text x="802" y="411.3333333333333" font-size="19" fill="#17324d">B 深度推理</text><path d="M730 405L790 405" fill="none" stroke="#73899e" stroke-width="2" marker-end="url(#arr)"/><rect x="210" y="480" width="610" height="48" rx="8" fill="#d9eaff" stroke="#c1cfdb"/><text x="222" y="510.3333333333333" font-size="19" fill="#17324d">槽 1：保留 A 的 RGB 与模型输入</text><text x="835" y="510" font-size="18" fill="#17324d">接受 A 配对 → 交换纹理所有权 → 槽可复用</text><rect x="485" y="560" width="675" height="48" rx="8" fill="#d4eee8" stroke="#c1cfdb"/><text x="497" y="590.3333333333334" font-size="19" fill="#17324d">槽 2：保留 B 的 RGB 与模型输入</text><rect x="210" y="650" width="865" height="44" rx="8" fill="#e5eaf0" stroke="#c1cfdb"/><text x="222" y="678.0" font-size="18" fill="#17324d">沿用上一对 SBS：重复显示时不重新搜索双眼颜色</text><rect x="1085" y="650" width="210" height="44" rx="8" fill="#d9eaff" stroke="#c1cfdb"/><text x="1097" y="678.3333333333334" font-size="19" fill="#17324d">显示 A</text><rect x="1300" y="650" width="85" height="44" rx="8" fill="#d4eee8" stroke="#c1cfdb"/><text x="1312" y="678.3333333333334" font-size="19" fill="#17324d">显示 B</text><path d="M485 328L485 375" fill="none" stroke="#73899e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><path d="M730 375L730 328" fill="none" stroke="#73899e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="36" y="736" font-size="16" fill="#526b82">调度关系示意，非实测 GPU 时间线；块宽不按耗时比例。A / B 表示各自完整配对的帧。</text></g></svg>