<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img"><title>03 / 同帧配对，解决的是时间错位</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#536981"/></marker><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#ffe8f1"/><path d="M0 9 L9 0" stroke="#d04c83" stroke-width="2"/></pattern></defs><rect width="1200" height="590" fill="#f5f8fc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="42" y="52" font-size="30" fill="#152b43" font-weight="600">03 / 同帧配对，解决的是时间错位</text><text x="42" y="86" font-size="17" fill="#536981" font-weight="400">示意：深度结果晚两帧到达；真实管线延迟会变化，并没有固定等待两帧。</text><text x="355" y="139" font-size="22" fill="#152b43" font-weight="600">t0</text><text x="580" y="139" font-size="22" fill="#152b43" font-weight="600">t1</text><text x="805" y="139" font-size="22" fill="#152b43" font-weight="600">t2</text><text x="1030" y="139" font-size="22" fill="#152b43" font-weight="600">t3</text><text x="42" y="207" font-size="22" fill="#152b43" font-weight="400">视频持续解码</text><text x="42" y="301" font-size="19" fill="#d04c83" font-weight="400">旧方案：新 RGB + 旧深度</text><text x="42" y="405" font-size="18" fill="#008a82" font-weight="400">当前：保留 RGB 后整对提交</text><rect x="337" y="164" width="152" height="65" rx="12" fill="#e4edfc" stroke="none"/><text x="355" y="205" font-size="21" fill="#377be9" font-weight="600">RGB 0</text><rect x="562" y="164" width="152" height="65" rx="12" fill="#e4edfc" stroke="none"/><text x="580" y="205" font-size="21" fill="#377be9" font-weight="600">RGB 1</text><rect x="787" y="164" width="152" height="65" rx="12" fill="#e4edfc" stroke="none"/><text x="805" y="205" font-size="21" fill="#377be9" font-weight="600">RGB 2</text><rect x="1012" y="164" width="152" height="65" rx="12" fill="#e4edfc" stroke="none"/><text x="1030" y="205" font-size="21" fill="#377be9" font-weight="600">RGB 3</text><rect x="787" y="260" width="152" height="65" rx="12" fill="#fce6ef" stroke="none"/><text x="805" y="300" font-size="18" fill="#d04c83" font-weight="400">RGB 2 + D0</text><rect x="787" y="365" width="152" height="65" rx="12" fill="#def3ee" stroke="none"/><text x="805" y="405" font-size="18" fill="#008a82" font-weight="400">RGB 0 + D0</text><rect x="1012" y="260" width="152" height="65" rx="12" fill="#fce6ef" stroke="none"/><text x="1030" y="300" font-size="18" fill="#d04c83" font-weight="400">RGB 3 + D1</text><rect x="1012" y="365" width="152" height="65" rx="12" fill="#def3ee" stroke="none"/><text x="1030" y="405" font-size="18" fill="#008a82" font-weight="400">RGB 1 + D1</text><path d="M410 230 L410 347 L780 347" fill="none" stroke="#008a82" stroke-width="2"/><path d="M780 347 L806 365" stroke="#008a82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="436" y="339" font-size="17" fill="#008a82" font-weight="400">保存生成 D0 的 RGB 0</text><text x="70" y="489" font-size="22" fill="#152b43" font-weight="600">轮廓对齐 ≠ 零延迟：成对画面比最新解码帧更旧，忙时重复上一对。</text><text x="70" y="522" font-size="19" fill="#536981" font-weight="400">深度错时减少，但运动更新率、字幕时钟与音画同步仍需单独处理。</text><text x="42" y="568" font-size="14" fill="#536981" font-weight="400">tachi · 原创原理示意，非片源截图 / 非算法画质对照 · 2026-09-17</text></g></svg>